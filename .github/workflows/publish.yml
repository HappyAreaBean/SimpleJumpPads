name: Release & Modrinth Deploy

on:
  push:
    tags:
      - '*.*.*'       # Matches 1.0.0, 2.1.4, etc.
      - 'v*.*.*'      # Matches v1.0.0, v2.1.4, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name to trigger build for (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Version Name
        id: version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG_NAME" ]; then
            version="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA}"
          fi

          echo "Version name: $version"
          echo "val=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ShadowJar
        run: ./gradlew shadowJar

      - name: Check generated JAR
        run: find plugin/build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        env:
          REPO_URL: "${{ github.server_url }}/${{ github.repository }}"
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Save changelog
        env:
          CHANGELOG: ${{ steps.git-cliff.outputs.content }}
        run: |
          mkdir -p plugin/build/tmp
          printf '%s' "$CHANGELOG" > plugin/build/tmp/CHANGELOG.txt

      - name: Publish Modrinth
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: plugin/build/libs/SimpleJumpPads-${{ steps.version.outputs.val }}.jar
          if-no-files-found: error
