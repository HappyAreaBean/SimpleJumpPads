name: Release & Modrinth Deploy

on:
  push:
    tags:
      - '*.*.*'       # Matches 1.0.0, 2.1.4, etc.
      - 'v*.*.*'      # Matches v1.0.0, v2.1.4, etc.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name to trigger build for (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Version Name
        id: version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "val=manual-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ShadowJar
        run: ./gradlew :plugin:shadowJar

      - name: Generate Changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        env:
          REPO_URL: "${{ github.server_url }}/${{ github.repository }}"
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Upload Modrinth Release
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: 'ewNLMW9y'
          game-versions: |-
            26.2
            26.1.x
            1.21.x
            1.20.x
            1.19.x
          loaders: 'paper'              # Update to your supported loader(s) (e.g., paper, spigot, fabric)
          version-type: 'release'
          version: ${{ steps.version.outputs.val }}
          name: '${{ steps.version.outputs.val }}'
          changelog: ${{ steps.git-cliff.outputs.content }}
          files: |
            plugin/build/libs/SimpleJumpPads-${{ steps.version.outputs.val }}.jar

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release-${{ steps.version.outputs.val }}
          path: plugin/build/libs/SimpleJumpPads-${{ steps.version.outputs.val }}.jar