# git-cliff configuration file for Conventional Commits
# https://git-cliff.org/docs/configuration

[changelog]
# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# Message format: - message - author [`(<commit>)`](commit link)
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} - {{ commit.author.name }} [`({{ commit.id | truncate(length=7, end="") }})`]({{ env.REPO_URL | default(value="https://github.com/HappyAreaBean/SimpleJumpPads") }}/commit/{{ commit.id }})
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove leading and trailing whitespace
trim = true

[git]
# parse commits according to conventional commits spec
conventional_commits = true
# filter out conventional commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing commit messages
commit_preprocessors = []
# regex for matching and grouping commits
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^release:", skip = true },
    { message = "^release", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore\\(deps.*\\)", group = "Dependencies" },
    { message = "^build\\(deps.*\\)", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { body = ".*", group = "Other" },
]
# protect breaking changes from being skipped
protect_breaking_commits = false
# filter out commits that match these regex patterns
filter_commits = false
# glob pattern for matching tags
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+"
# regex for skipping tags
skip_tags = "v0.0.0-.*"
# regex for ignoring tags
ignore_tags = ""
# sort tags chronologically
date_order = false
# sort commits inside sections chronologically
sort_commits = "oldest"